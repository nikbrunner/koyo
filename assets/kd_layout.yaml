combos:
    # Base layer combos
    - { p: [31, 32], k: "[", l: [LY_BAS] } # J + K = Left bracket
    - { p: [32, 33], k: "]", l: [LY_BAS] } # K + L = Right bracket
    - { p: [26, 27], k: SPC, l: [LY_BAS] } # S + D = Space

    # Num layer combos
    - { p: [43, 44], k: ",", l: [LY_NUM_FN] } # 1 + 2 = Comma
    - { p: [44, 45], k: ".", l: [LY_NUM_FN] } # 2 + 3 = Dot
