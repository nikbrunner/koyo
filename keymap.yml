# kōyō keymap: the source of truth for every board.
#
# Each layer has five rows in the Voyager shape: four rows of twelve keys
# (outer key, five core keys | five core keys, outer key; the top row is all
# outer ring), then the thumbs: left two | right two.
# Keys are QMK keycodes. XXXXXXX is a dead key.
#
# Boards without an outer ring (Corne, Chocofi) use the core and thumbs only.
# A layer with `boards:` exists only on those boards; elsewhere, keys that
# reference it become XXXXXXX.
#
# Run `./koyo update keymap` after editing to regenerate the board headers
# and assets/layout.svg.

# Hues of Black Atom JPN Kōyō dark in QMK's HSV, more saturated because LEDs wash out pale colours.
palette:
    amber: [27, 240, 228]
    copper: [16, 215, 248]
    cream: [24, 95, 225]
    cyan: [120, 190, 195]
    green: [94, 150, 192]
    pink: [236, 135, 211]
    red: [251, 200, 254]
    violet: [184, 130, 215]

# A layer's `background` lights every key at background_v. Its `highlights` paint
# the listed keys, written exactly as on that layer, in a palette colour. Remaining
# modifiers and mod-taps, including those showing through from a lower layer, get `mods`.
lighting:
    background_v: 70
    mods: cream

layers:
    LY_BAS: # Base
        background: violet
        highlights:
            amber: KC_H, KC_J, LT(LY_SYM, KC_K), KC_L
        rows:
            - KC_ESC  , KC_1               , KC_2               , KC_3               , KC_4               , KC_5      |   KC_6    , KC_7               , KC_8                   , KC_9                 , KC_0                   , KC_MINS
            - KC_TAB  , KC_Q               , KC_W               , KC_E               , KC_R               , KC_T      |   KC_Y    , KC_U               , KC_I                   , KC_O                 , KC_P                   , KC_EQL
            - KC_LSFT , KC_A               , KC_S               , LT(LY_SYM, KC_D)   , KC_F               , KC_G      |   KC_H    , KC_J               , LT(LY_SYM, KC_K)       , KC_L                 , KC_SCLN                , KC_RSFT
            - KC_LCTL , MT(MOD_LGUI, KC_Z) , MT(MOD_LALT, KC_X) , MT(MOD_LCTL, KC_C) , MT(MOD_LSFT, KC_V) , KC_B      |   KC_N    , MT(MOD_RSFT, KC_M) , MT(MOD_RCTL, KC_COMMA) , MT(MOD_LALT, KC_DOT) , MT(MOD_RGUI, KC_SLASH) , KC_RCTL
            - LT(LY_EXT, KC_SPC) , LT(LY_NUM_FN, KC_ESC)   |   LT(LY_MED, KC_BSPC) , HYPR_T(KC_ENT)

    LY_GAM: # Gaming
        boards: [voyager]
        background: cyan
        highlights:
            amber: KC_W, KC_A, KC_S, KC_D
        rows:
            - KC_ESC  , KC_1 , KC_2 , KC_3 , KC_4 , KC_5   |   KC_6 , KC_7 , KC_8     , KC_9   , KC_0     , KC_MINS
            - KC_TAB  , KC_Q , KC_W , KC_E , KC_R , KC_T   |   KC_Y , KC_U , KC_I     , KC_O   , KC_P     , KC_EQL
            - KC_LCTL , KC_A , KC_S , KC_D , KC_F , KC_G   |   KC_H , KC_J , KC_K     , KC_L   , KC_SCLN  , KC_RSFT
            - KC_LSFT , KC_Z , KC_X , KC_C , KC_V , KC_B   |   KC_N , KC_M , KC_COMMA , KC_DOT , KC_SLASH , KC_RCTL
            - KC_SPC , MO(LY_GAM_NUM)   |   LT(LY_MED, KC_BSPC) , HYPR_T(KC_ENT)

    LY_EXT: # Extended
        background: pink
        highlights:
            amber: KC_LEFT, KC_DOWN, KC_UP, KC_RGHT
        rows:
            - KC_TRNS , KC_TRNS          , KC_TRNS          , KC_TRNS          , KC_TRNS          , KC_TRNS      |   KC_TRNS , KC_TRNS    , KC_TRNS      , KC_TRNS      , KC_TRNS       , KC_TRNS
            - KC_TRNS , LGUI(KC_Q)       , LGUI(KC_W)       , LGUI(KC_E)       , LGUI(KC_R)       , LGUI(KC_T)   |   XXXXXXX , RALT(KC_U) , XXXXXXX      , XXXXXXX      ,XXXXXXX        , KC_TRNS
            - KC_TRNS , EXT_A            , EXT_S            , EXT_D            , EXT_F            , LGUI(KC_G)   |   KC_LEFT , KC_DOWN    , KC_UP        , KC_RGHT      , HYPR(KC_SCLN) , KC_TRNS
            - KC_TRNS , LGUI(KC_Z)       , LGUI(KC_X)       , LGUI(KC_C)       , LGUI(KC_V)       , LGUI(KC_B)   |   XXXXXXX , CW_TOGG    , LSFT(KC_TAB) , KC_TAB       , XXXXXXX       , KC_TRNS
            - XXXXXXX , XXXXXXX   | LGUI(KC_GRV), LGUI(KC_TAB)

    LY_SYM: # Symbols
        background: green
        highlights:
            amber: KC_LPRN, KC_RPRN, KC_LBRC, KC_RBRC, KC_LCBR, KC_RCBR, KC_LABK, KC_RABK
            cyan: KC_DQUO, KC_QUOT, KC_GRV
            pink: KC_PLUS, KC_MINS, KC_ASTR, KC_PERC, KC_EXLM, KC_AMPR, KC_PIPE, KC_CIRC, KC_TILD, KC_EQUAL, KC_SLASH
        rows:
            - KC_TRNS , KC_TRNS , KC_TRNS , KC_TRNS , KC_TRNS , KC_TRNS   |   KC_TRNS  , KC_TRNS , KC_TRNS , KC_TRNS , KC_TRNS  , KC_TRNS
            - KC_TRNS , KC_CIRC , KC_PLUS , KC_HASH , KC_PERC , KC_DLR    |   KC_LABK  , KC_LCBR , KC_DQUO , KC_RCBR , KC_RABK  , KC_TRNS
            - KC_TRNS , KC_EXLM , KC_MINS , KC_AMPR , KC_QUES , KC_PIPE   |   KC_EQUAL , KC_LBRC , KC_QUOT , KC_RBRC , KC_COLN  , KC_TRNS
            - KC_TRNS , KC_TILD , KC_UNDS , KC_ASTR , KC_AT   , XXXXXXX   |   KC_BSLS  , KC_LPRN , KC_GRV  , KC_RPRN , KC_SLASH , KC_TRNS
            - XXXXXXX , XXXXXXX   |   XXXXXXX , XXXXXXX

    LY_NUM_FN: # Numbers & function keys
        background: copper
        highlights:
            cyan: KC_0, KC_1, KC_2, KC_3, MT(MOD_RSFT, KC_4), MT(MOD_RCTL, KC_5), MT(MOD_RALT, KC_6), KC_7, KC_8, KC_9
            amber: TG(LY_GAM)
        rows:
            - KC_TRNS    , KC_TRNS             , KC_TRNS             , KC_TRNS             , KC_TRNS             , KC_TRNS   |   KC_TRNS  , KC_TRNS            , KC_TRNS            , KC_TRNS            , KC_TRNS  , KC_TRNS
            - KC_TRNS    , KC_F9               , KC_F10              , KC_F11              , KC_F12              , XXXXXXX   |   KC_PLUS  , KC_7               , KC_8               , KC_9               , KC_ASTR  , KC_TRNS
            - KC_TRNS    , MT(MOD_LGUI, KC_F5) , MT(MOD_LALT, KC_F6) , MT(MOD_LCTL, KC_F7) , MT(MOD_LSFT, KC_F8) , TG(LY_GAM)   |   KC_EQUAL , MT(MOD_RSFT, KC_4) , MT(MOD_RCTL, KC_5) , MT(MOD_RALT, KC_6) , KC_COLN  , KC_TRNS
            - KC_TRNS    , KC_F1               , KC_F2               , KC_F3               , KC_F4               , XXXXXXX   |   KC_MINUS , KC_1               , KC_2               , KC_3               , KC_SLASH , KC_TRNS
            - XXXXXXX , XXXXXXX   |   C(KC_B) , KC_0

    LY_GAM_NUM: # Numbers & function keys for gaming, without mod-taps
        boards: [voyager]
        background: copper
        highlights:
            cyan: KC_0, KC_1, KC_2, KC_3, KC_4, KC_5, KC_6, KC_7, KC_8, KC_9
            amber: TG(LY_GAM)
        rows:
            - KC_TRNS , KC_TRNS , KC_TRNS , KC_TRNS , KC_TRNS , KC_TRNS      |   KC_TRNS  , KC_TRNS , KC_TRNS , KC_TRNS , KC_TRNS  , KC_TRNS
            - KC_TRNS , KC_F9   , KC_F10  , KC_F11  , KC_F12  , XXXXXXX      |   KC_PLUS  , KC_7    , KC_8    , KC_9    , KC_ASTR  , KC_TRNS
            - KC_TRNS , KC_F5   , KC_F6   , KC_F7   , KC_F8   , TG(LY_GAM)   |   KC_EQUAL , KC_4    , KC_5    , KC_6    , KC_COLN  , KC_TRNS
            - KC_TRNS , KC_F1   , KC_F2   , KC_F3   , KC_F4   , XXXXXXX      |   KC_MINUS , KC_1    , KC_2    , KC_3    , KC_SLASH , KC_TRNS
            - XXXXXXX , XXXXXXX   |   C(KC_B) , KC_0

    LY_MED: # Media & system
        background: cream
        highlights:
            violet: KC_VOLD, KC_MUTE, KC_VOLU, KC_MPRV, KC_MPLY, KC_MNXT
            red: QK_BOOT
        rows:
            - KC_TRNS , KC_TRNS    , KC_TRNS , KC_TRNS , KC_TRNS , KC_TRNS   |   KC_TRNS , KC_TRNS    , KC_TRNS , KC_TRNS   , KC_TRNS         , KC_TRNS
            - KC_TRNS , G(C(KC_Q)) , KC_VOLD , KC_MUTE , KC_VOLU , QK_BOOT   |   XXXXXXX , XXXXXXX    , RM_TOGG , XXXXXXX   , KC_PRINT_SCREEN , KC_TRNS
            - KC_TRNS , XXXXXXX    , KC_MPRV , KC_MPLY , KC_MNXT , XXXXXXX   |   XXXXXXX , G(KC_MINS) , G(KC_0) , G(KC_EQL) , XXXXXXX         , KC_TRNS
            - KC_TRNS , XXXXXXX    , KC_BRID , XXXXXXX , KC_BRIU , XXXXXXX   |   XXXXXXX , DT_DOWN    , DT_PRNT , DT_UP     , XXXXXXX         , KC_TRNS
            - XXXXXXX , XXXXXXX   |   XXXXXXX , XXXXXXX

# Combos fire on any layer where their keys exist. `layer` is the layer holding
# their keys: it places them in the drawing, decides which boards get them, and
# names their C array <layer>_CMB_<name>.
combos:
    BRACKET_LEFT:
        layer: LY_BAS
        keys: KC_J, LT(LY_SYM, KC_K)
        send: KC_LBRC
    BRACKET_RIGHT:
        layer: LY_BAS
        keys: LT(LY_SYM, KC_K), KC_L
        send: KC_RBRC
    COMMA:
        layer: LY_NUM_FN
        keys: KC_1, KC_2
        send: KC_COMMA
    DOT:
        layer: LY_NUM_FN
        keys: KC_2, KC_3
        send: KC_DOT
